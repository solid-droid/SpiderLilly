<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>SpiderLilly</title>
</head>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./component.css">
<body>
    <div class="container">
        <div class="Tools-Container">
           <div class="Options"></div>
           <div class="URL">
              <div class="urlBox">
                <input id="urlInput" class="inputBox" placeholder="Enter Website URL" value="http://localhost:14223/Kibo2"/>
                <div id="goButton" class="button">GO</div>
              </div>
           </div>
        </div>
        <div class="body">
          <div class="sideNav">

          </div>
          <div id="WebView-Container">
            <div class="toggleView">
              <input type="radio" id="viewType" name="viewType" value="Webview">
              <label for="Webview">Webview</label><br>
              <input type="radio" id="viewType" name="viewType" value="Player">
              <label for="Player">Player</label><br>
            </div>
            <webview id="web" 
            src="http://localhost:14223/Kibo2" 
            class="webview"
            preload="./preload.js"></webview>
            <video id="player" src="" controls></video>
            <div id="mask1" class="mask">
              <div class="maskText">
                <div>No Recording Available. </div>
              </div>
            </div>
            <div id="mask2" class="mask">
                <div class="maskText">
                  <div>Registring Click</div>
                  <div>Please give enough buffer time for next screen to load.</div>
                  <div class="counterText">2</div>
                </div>
            </div>
          </div>
        </div>
        </div>
    </div>
    <div class="testCode">
      <pre id="code"></pre>
    </div>
  <script src="../node_modules/jquery/dist/jquery.min.js"></script>
  <script src="../helper/util.js"></script>
  <script src="index.js"></script>
</body>

</html>
